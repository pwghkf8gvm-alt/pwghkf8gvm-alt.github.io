<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的旅游工作台</title>
  <style>
/* ============================================
   旅游工作台 - 卡通风格主题 (单文件版)
   ============================================ */
:root {
  --primary: #ff6b9d;
  --primary-dark: #e85a87;
  --secondary: #4ecdc4;
  --secondary-dark: #3db5ac;
  --accent: #ffe66d;
  --accent-dark: #f5d83a;
  --bg-cream: #fff8ec;
  --bg-card: #ffffff;
  --text-main: #2d3436;
  --text-soft: #636e72;
  --border-dark: #2d3436;
  --shadow-color: rgba(45, 52, 54, 0.15);
  --shadow-hard: 4px 4px 0 var(--border-dark);
  --shadow-soft: 0 8px 24px var(--shadow-color);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Quicksand', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
  background: var(--bg-cream);
  background-image:
    radial-gradient(circle at 10% 20%, rgba(255, 230, 109, 0.3) 0%, transparent 30%),
    radial-gradient(circle at 90% 80%, rgba(78, 205, 196, 0.3) 0%, transparent 30%),
    radial-gradient(circle at 50% 50%, rgba(255, 107, 157, 0.1) 0%, transparent 50%);
  min-height: 100vh;
  color: var(--text-main);
  line-height: 1.6;
}
.navbar {
  background: var(--bg-card);
  border-bottom: 4px solid var(--border-dark);
  padding: 1rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 4px 0 var(--shadow-color);
  position: sticky;
  top: 0;
  z-index: 100;
}
.navbar-brand {
  font-size: 1.8rem;
  font-weight: 900;
  color: var(--primary);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  cursor: pointer;
}
.navbar-brand .logo {
  display: inline-block;
  background: var(--accent);
  border: 3px solid var(--border-dark);
  border-radius: 50%;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  transform: rotate(-10deg);
  box-shadow: var(--shadow-hard);
}
.navbar-breadcrumb {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.95rem;
  color: var(--text-soft);
}
.navbar-breadcrumb a, .navbar-breadcrumb span.crumb-link {
  color: var(--secondary-dark);
  text-decoration: none;
  font-weight: 600;
  padding: 0.3rem 0.8rem;
  border-radius: 20px;
  background: rgba(78, 205, 196, 0.15);
  transition: all 0.2s;
  cursor: pointer;
}
.navbar-breadcrumb a:hover, .navbar-breadcrumb span.crumb-link:hover {
  background: rgba(78, 205, 196, 0.3);
  transform: translateY(-2px);
}
.navbar-breadcrumb .sep { color: var(--text-soft); opacity: 0.5; }
.navbar-breadcrumb .current { color: var(--text-main); font-weight: 700; }
.container { max-width: 960px; margin: 0 auto; padding: 2.2rem 1.5rem 4rem; }
.page-header { text-align: center; margin-bottom: 3rem; }
.page-title {
  font-size: 3rem; font-weight: 900; color: var(--text-main);
  display: inline-block; position: relative; margin-bottom: 0.5rem;
}
.page-title::after {
  content: ''; display: block; height: 8px; background: var(--accent);
  border-radius: 4px; margin-top: 0.3rem; border: 2px solid var(--border-dark);
  transform: rotate(-1deg);
}
.page-subtitle { font-size: 1.2rem; color: var(--text-soft); font-weight: 500; }
.cities-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 2rem; margin-top: 2rem;
}
.city-card {
  background: var(--bg-card); border: 4px solid var(--border-dark);
  border-radius: 24px; overflow: hidden; cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: var(--shadow-hard); position: relative;
  text-decoration: none; color: inherit; display: block;
}
.city-card:hover { transform: translate(-4px, -4px) rotate(-0.5deg); box-shadow: 8px 8px 0 var(--border-dark); }
.city-card:active { transform: translate(0, 0); box-shadow: var(--shadow-hard); }
.city-card-banner {
  height: 180px; position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center; font-size: 4rem;
}
.city-card-banner.tokyo { background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%); }
.city-card-banner::before {
  content: ''; position: absolute; inset: 0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,0.4) 0%, transparent 25%),
    radial-gradient(circle at 80% 70%, rgba(255,255,255,0.3) 0%, transparent 25%);
}
.city-card-emoji { position: relative; z-index: 2; filter: drop-shadow(2px 4px 0 rgba(0,0,0,0.15)); }
.city-card-body { padding: 1.5rem; }
.city-card-name { font-size: 1.75rem; font-weight: 900; margin-bottom: 0.3rem; color: var(--text-main); }
.city-card-dates {
  font-size: 1.05rem; color: var(--text-soft); font-weight: 600;
  display: flex; align-items: center; gap: 0.4rem;
}
.city-card-meta {
  margin-top: 1rem; padding-top: 1rem; border-top: 2px dashed #e0e0e0;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 0.9rem; color: var(--text-soft);
}
.city-card-days {
  background: var(--accent); border: 2px solid var(--border-dark);
  border-radius: 20px; padding: 0.2rem 0.8rem; font-weight: 700; color: var(--text-main);
}
.city-card-arrow {
  background: var(--primary); color: white; width: 36px; height: 36px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--border-dark); font-weight: 900; font-size: 1.2rem;
}
.dates-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.5rem; margin-top: 2rem;
}
.date-card {
  background: var(--bg-card); border: 4px solid var(--border-dark);
  border-radius: 20px; padding: 1.5rem; cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: var(--shadow-hard); text-decoration: none; color: var(--text-main);
  position: relative; display: block;
}
.date-card:hover { transform: translate(-3px, -3px); box-shadow: 7px 7px 0 var(--border-dark); }
.date-card-day-badge {
  display: inline-block; background: var(--primary); color: white;
  padding: 0.3rem 1rem; border-radius: 20px; border: 2px solid var(--border-dark);
  font-weight: 800; font-size: 0.85rem; margin-bottom: 0.8rem;
}
.date-card-date { font-size: 1.55rem; font-weight: 900; margin-bottom: 0.3rem; }
.date-card-weekday { font-size: 1.1rem; color: var(--text-soft); font-weight: 600; margin-bottom: 1rem; }
.date-card-preview {
  font-size: 0.85rem; color: var(--text-soft); padding-top: 0.8rem;
  border-top: 2px dashed #e0e0e0; display: flex; justify-content: space-between; align-items: center;
}
.date-card-count {
  background: var(--secondary); color: white; padding: 0.2rem 0.7rem;
  border-radius: 16px; font-weight: 700; border: 2px solid var(--border-dark); font-size: 0.8rem;
}
.date-card.has-itinerary { background: linear-gradient(135deg, #fff 0%, #fff8ec 100%); }
.date-card.empty {
  background: repeating-linear-gradient(45deg, #fff, #fff 10px, #fff8ec 10px, #fff8ec 20px);
}
.date-card.empty .date-card-day-badge { background: #ccc; }
/* 时间线改为 flex/grid 布局，确保时间文字不被截断 */
.timeline { max-width: 900px; margin: 2rem auto; position: relative; padding-left: 0; padding-right: 0; }
.timeline-item {
  display: grid;
  grid-template-columns: 110px 40px 1fr;
  gap: 0 12px;
  align-items: start;
  margin-bottom: 2.2rem;
  position: relative;
}
.timeline::before {
  content: '';
  position: absolute;
  left: 125px;  /* 110px 时间列 + 12px 间距 + 40px/2 - 5px/2 */
  top: 0; bottom: 0;
  width: 5px; background: var(--border-dark); border-radius: 3px;
  z-index: 1;
}
.timeline-time {
  grid-column: 1;
  justify-self: end;
  align-self: start;
  text-align: right;
  font-weight: 800; color: var(--text-main); font-size: 1rem;
  font-family: 'SF Mono', 'Menlo', 'Consolas', 'Courier New', monospace;
  font-variant-numeric: tabular-nums; letter-spacing: -0.5px; line-height: 1.45;
  padding-top: 18px;
  min-width: 0;
  overflow: visible;
}
.timeline-time .time-start { display: block; }
.timeline-time .time-end { display: block; font-size: 0.8rem; color: var(--text-soft); font-weight: 700; margin-top: 2px; }
.timeline-dot {
  grid-column: 2;
  justify-self: center;
  width: 40px; height: 40px;
  border-radius: 50%; background: var(--accent); border: 4px solid var(--border-dark);
  z-index: 2; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
  flex-shrink: 0; margin-top: 12px;
}
.timeline-content {
  grid-column: 3;
  background: var(--bg-card); border: 3px solid var(--border-dark);
  border-radius: 18px; padding: 1.2rem 1.5rem; box-shadow: var(--shadow-hard); transition: all 0.2s;
  min-width: 0;
}
.timeline-content {
  background: var(--bg-card); border: 3px solid var(--border-dark);
  border-radius: 18px; padding: 1.2rem 1.5rem; box-shadow: var(--shadow-hard); transition: all 0.2s;
}
.timeline-content:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--border-dark); }
.timeline-title {
  font-size: 1.35rem; font-weight: 800; margin-bottom: 0.5rem; color: var(--text-main);
  display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
}
.timeline-desc { font-size: 1.05rem; color: var(--text-soft); line-height: 1.7; margin-bottom: 0.35rem; }
.timeline-tag {
  display: inline-block; background: rgba(78, 205, 196, 0.2); color: var(--secondary-dark);
  padding: 0.25rem 0.8rem; border-radius: 12px; font-size: 0.85rem; font-weight: 700;
  margin-right: 0.4rem; margin-top: 0.3rem; border: 1.5px solid var(--secondary);
}
.timeline-tag.food { background: rgba(255, 107, 157, 0.15); color: var(--primary-dark); border-color: var(--primary); }
.timeline-tag.transport { background: rgba(108, 117, 125, 0.15); color: #495057; border-color: #6c757d; }
.timeline-tag-wrapper { margin-bottom: 0.5rem; }
/* 行程图片 */
.timeline-photo {
  margin-top: 0.8rem; border: 2px solid var(--border-dark); border-radius: 14px;
  overflow: hidden; background: var(--bg-cream); position: relative;
  box-shadow: 2px 2px 0 var(--border-dark);
}
.timeline-photo img {
  display: block; width: 100%; height: auto; max-height: 260px; object-fit: cover;
  border-radius: 12px; margin: -2px;
  min-height: 80px; background: linear-gradient(135deg, #fff8ec, #fff);
}
.timeline-photo-actions {
  position: absolute; top: 6px; right: 6px; display: flex; gap: 6px;
  opacity: 0; transition: opacity 0.2s;
}
.timeline-photo:hover .timeline-photo-actions { opacity: 1; }
.timeline-photo-btn {
  background: rgba(255,255,255,0.95); border: 2px solid var(--border-dark);
  border-radius: 10px; width: 32px; height: 32px; cursor: pointer;
  font-size: 0.9rem; display: flex; align-items: center; justify-content: center;
  box-shadow: 2px 2px 0 var(--border-dark); padding: 0;
}
.timeline-photo-btn:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--border-dark); }
.timeline-photo-btn:active { transform: translate(0,0); box-shadow: 2px 2px 0 var(--border-dark); }
.timeline-upload {
  display: inline-flex; align-items: center; gap: 0.3rem;
  margin-top: 0.6rem; border: 2px dashed var(--secondary); border-radius: 20px;
  padding: 0.3rem 0.8rem; text-align: center; cursor: pointer; transition: all 0.2s;
  background: rgba(78, 205, 196, 0.06); color: var(--secondary-dark);
  font-weight: 700; font-size: 0.82rem;
}
.timeline-upload:hover {
  background: rgba(78, 205, 196, 0.15); border-color: var(--secondary-dark);
}
.timeline-upload input { display: none; }
/* 地址栏 + 去这里按钮 */
.timeline-address {
  display: flex; gap: 0.5rem; align-items: stretch; margin-top: 0.7rem;
  flex-wrap: wrap;
}
.timeline-address-input {
  flex: 1; min-width: 180px;
  border: 2px solid var(--border-dark); border-radius: 12px;
  padding: 0.55rem 0.8rem; font-family: inherit; font-size: 0.95rem;
  background: var(--bg-cream); color: var(--text-main);
  transition: all 0.2s;
}
.timeline-address-input:focus {
  outline: none; box-shadow: 2px 2px 0 var(--border-dark);
  background: #fff;
}
.timeline-address-input::placeholder { color: #aaa; }
.timeline-go-btn {
  flex-shrink: 0;
  display: inline-flex; align-items: center; gap: 0.35rem;
  background: var(--secondary); color: white;
  border: 2px solid var(--border-dark); border-radius: 12px;
  padding: 0.55rem 1rem; font-family: inherit; font-size: 0.95rem; font-weight: 700;
  cursor: pointer; box-shadow: 2px 2px 0 var(--border-dark);
  transition: all 0.2s; text-decoration: none; white-space: nowrap;
}
.timeline-go-btn:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--border-dark); }
.timeline-go-btn:active { transform: translate(0,0); box-shadow: 2px 2px 0 var(--border-dark); }
.timeline-go-btn.disabled { background: #ccc; cursor: not-allowed; pointer-events: none; }
.empty-state {
  text-align: center; padding: 4rem 2rem; background: var(--bg-card);
  border: 4px dashed #ccc; border-radius: 24px; margin-top: 2rem;
}
.empty-state-emoji { font-size: 4rem; margin-bottom: 1rem; }
.empty-state-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; color: var(--text-soft); }
.empty-state-desc { color: var(--text-soft); margin-bottom: 1.5rem; }
.btn {
  display: inline-flex; align-items: center; gap: 0.5rem;
  background: var(--primary); color: white; border: 3px solid var(--border-dark);
  border-radius: 16px; padding: 0.7rem 1.5rem; font-size: 1rem; font-weight: 700;
  cursor: pointer; text-decoration: none; box-shadow: var(--shadow-hard);
  transition: all 0.2s; font-family: inherit;
}
.btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--border-dark); }
.btn:active { transform: translate(0, 0); box-shadow: var(--shadow-hard); }
.btn-secondary { background: var(--secondary); }
.btn-accent { background: var(--accent); color: var(--text-main); }
.itinerary-header {
  background: var(--bg-card); border: 4px solid var(--border-dark);
  border-radius: 24px; padding: 2rem; margin-bottom: 2rem;
  box-shadow: var(--shadow-hard); position: relative; overflow: hidden;
}
.itinerary-header::before {
  content: ''; position: absolute; top: -30px; right: -30px;
  width: 120px; height: 120px; background: var(--accent);
  border-radius: 50%; border: 3px solid var(--border-dark); opacity: 0.4;
}
.itinerary-header::after {
  content: ''; position: absolute; bottom: -20px; left: -20px;
  width: 80px; height: 80px; background: var(--secondary);
  border-radius: 50%; border: 3px solid var(--border-dark); opacity: 0.3;
}
.itinerary-day-badge {
  display: inline-block; background: var(--primary); color: white;
  padding: 0.4rem 1.2rem; border-radius: 20px; border: 3px solid var(--border-dark);
  font-weight: 800; margin-bottom: 0.8rem; position: relative; z-index: 2;
}
.itinerary-date { font-size: 2.4rem; font-weight: 900; margin-bottom: 0.3rem; position: relative; z-index: 2; }
.itinerary-weekday { font-size: 1.3rem; color: var(--text-soft); font-weight: 600; position: relative; z-index: 2; }
.itinerary-actions {
  display: flex; gap: 1rem; margin-top: 1.5rem; position: relative; z-index: 2; flex-wrap: wrap;
}
.import-section {
  background: var(--bg-card); border: 4px solid var(--border-dark);
  border-radius: 24px; padding: 2rem; margin: 2rem 0; box-shadow: var(--shadow-hard);
}
.import-section h3 { font-size: 1.4rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
.import-section textarea {
  width: 100%; min-height: 200px; border: 3px solid var(--border-dark);
  border-radius: 16px; padding: 1rem; font-family: inherit; font-size: 0.95rem;
  resize: vertical; background: var(--bg-cream); color: var(--text-main);
}
.import-section textarea:focus { outline: none; box-shadow: var(--shadow-hard); }
.import-format-hint {
  background: rgba(78, 205, 196, 0.1); border: 2px dashed var(--secondary);
  border-radius: 12px; padding: 1rem; margin-top: 1rem; font-size: 0.85rem; color: var(--text-soft);
}
.import-format-hint code {
  background: rgba(0,0,0,0.06); padding: 0.1rem 0.4rem; border-radius: 4px;
  font-family: 'Courier New', monospace; font-weight: 700; color: var(--primary-dark);
}
.import-actions { display: flex; gap: 1rem; margin-top: 1rem; flex-wrap: wrap; }

/* 天气卡片 */
.weather-card {
  display: flex; align-items: center; gap: 1rem;
  background: linear-gradient(135deg, #e0f4ff 0%, #fff 100%);
  border: 3px solid var(--border-dark); border-radius: 16px;
  padding: 0.9rem 1.3rem; margin-bottom: 1.2rem;
  box-shadow: var(--shadow-hard); position: relative; z-index: 2;
  flex-wrap: wrap;
}
.weather-icon { font-size: 2.2rem; line-height: 1; }
.weather-info { flex: 1; min-width: 140px; }
.weather-temp { font-size: 1.4rem; font-weight: 900; color: var(--text-main); }
.weather-desc { font-size: 0.9rem; color: var(--text-soft); font-weight: 600; }
.weather-rain { font-size: 0.85rem; color: #4a90e2; font-weight: 700; margin-top: 2px; }
.weather-loading { font-size: 0.9rem; color: var(--text-soft); padding: 0.5rem 0; }

/* AI 推荐面板 */
.ai-panel {
  background: linear-gradient(135deg, #fff8ec 0%, #fff 100%);
  border: 4px solid var(--border-dark); border-radius: 20px;
  padding: 1.5rem; margin: 2rem 0; box-shadow: var(--shadow-hard);
  position: relative;
}
.ai-panel::before {
  content: '🤖'; position: absolute; top: -16px; left: 20px;
  background: var(--bg-cream); padding: 0 8px; font-size: 1.5rem;
}
.ai-panel h3 { font-size: 1.3rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.4rem; }
.ai-panel-desc { font-size: 0.9rem; color: var(--text-soft); margin-bottom: 1rem; }
.ai-input-row { display: flex; gap: 0.6rem; flex-wrap: wrap; }
.ai-input {
  flex: 1; min-width: 200px;
  border: 2px solid var(--border-dark); border-radius: 12px;
  padding: 0.6rem 0.9rem; font-family: inherit; font-size: 1rem;
  background: #fff; color: var(--text-main);
}
.ai-input:focus { outline: none; box-shadow: 2px 2px 0 var(--border-dark); }
.ai-suggestions { margin-top: 0.8rem; display: flex; flex-wrap: wrap; gap: 0.4rem; }
.ai-suggestion-chip {
  background: rgba(78, 205, 196, 0.15); border: 1.5px solid var(--secondary);
  color: var(--secondary-dark); padding: 0.3rem 0.8rem;
  border-radius: 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer;
  transition: all 0.2s;
}
.ai-suggestion-chip:hover { background: var(--secondary); color: white; transform: translateY(-1px); }
.ai-result {
  margin-top: 1rem; padding: 1rem; background: #fff;
  border: 2px solid var(--border-dark); border-radius: 14px;
  box-shadow: 2px 2px 0 var(--border-dark);
}
.ai-result-title { font-weight: 800; margin-bottom: 0.5rem; color: var(--text-main); }
.ai-result-detail { font-size: 0.92rem; color: var(--text-soft); line-height: 1.6; margin-bottom: 0.8rem; }
.ai-result-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }

/* 备注栏（行程卡片） */
.timeline-note {
  margin-top: 0.7rem; border: 2px solid #ffd6e0; border-radius: 14px;
  padding: 0.8rem; background: rgba(255, 230, 109, 0.08);
  position: relative;
}
/* 空状态：紧凑 chip */
.timeline-note-empty {
  display: inline-flex; align-items: center; gap: 0.3rem;
  margin-top: 0.6rem; border: 2px dashed var(--primary); border-radius: 20px;
  padding: 0.3rem 0.8rem; cursor: pointer; transition: all 0.2s;
  background: rgba(255, 107, 157, 0.06); color: var(--primary-dark);
  font-weight: 700; font-size: 0.82rem;
}
.timeline-note-empty:hover {
  background: rgba(255, 107, 157, 0.15); border-color: var(--primary-dark);
}
.timeline-note textarea {
  width: 100%; min-height: 60px; resize: vertical;
  border: none; background: transparent; font-family: inherit;
  font-size: 0.95rem; color: var(--text-main); line-height: 1.6;
  padding: 0; outline: none;
}
.timeline-note textarea::placeholder { color: #c8b0b0; }
.timeline-note-label {
  font-size: 0.78rem; font-weight: 800; color: var(--primary-dark);
  margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.3rem;
}
.timeline-note-links {
  margin-top: 0.4rem; display: flex; flex-wrap: wrap; gap: 0.3rem;
}
.timeline-note-link {
  display: inline-flex; align-items: center; gap: 0.25rem;
  background: rgba(255, 107, 157, 0.15); color: var(--primary-dark);
  border: 1.5px solid var(--primary); border-radius: 12px;
  padding: 0.2rem 0.6rem; font-size: 0.78rem; font-weight: 700;
  text-decoration: none; max-width: 100%; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
}

function showToast(message, type) {
  type = type || 'success';
  const toast = document.createElement('div');
  toast.className = 'toast ' + (type === 'error' ? 'error' : '');
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(function() { toast.classList.add('show'); }, 50);
  setTimeout(function() {
    toast.classList.remove('show');
    setTimeout(function() { toast.remove(); }, 400);
  }, 2500);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// 行程解析
function parseItinerary(text) {
  const lines = text.split('\n').map(function(l) { return l.trim(); }).filter(Boolean);
  const items = [];
  lines.forEach(function(line) {
    const match = line.match(/^(\d{1,2}[:：]\d{2})(?:\s*[-~至到]\s*(\d{1,2}[:：]\d{2}))?\s+(.+)$/);
    if (match) {
      let time = match[1].replace('：', ':');
      const endTime = match[2] ? match[2].replace('：', ':') : null;
      const rest = match[3];
      const tagMatch = rest.match(/\[([^\]]+)\]/);
      let tag = null;
      let titleAndDesc = rest;
      if (tagMatch) {
        tag = tagMatch[1];
        titleAndDesc = rest.replace(/\[([^\]]+)\]/g, '').trim();
      }
      let title = titleAndDesc;
      let desc = '';
      const sepMatch = titleAndDesc.match(/^([^：:-]+)[：:-]\s*(.+)$/);
      if (sepMatch) {
        title = sepMatch[1].trim();
        desc = sepMatch[2].trim();
      }
      items.push({ time: time, endTime: endTime, title: title, desc: desc, tag: tag ? tag.toLowerCase() : null });
    } else {
      if (items.length > 0) {
        const last = items[items.length - 1];
        if (last.desc) { last.desc += '\n' + line; } else { last.desc = line; }
      }
    }
  });
  items.sort(function(a, b) { return a.time.localeCompare(b.time); });
  return items;
}

function timeEmoji(time) {
  const hour = parseInt(time.split(':')[0]);
  if (hour < 6) return '🌙';
  if (hour < 10) return '🌅';
  if (hour < 14) return '☀️';
  if (hour < 17) return '🌤️';
  if (hour < 20) return '🌇';
  return '🌃';
}

function tagInfo(tag) {
  if (!tag) return { emoji: '📍', cls: '' };
  const t = tag.toLowerCase();
  if (['美食','早餐','午餐','晚餐','小吃','咖啡','food','meal'].some(function(k){ return t.includes(k); })) return { emoji: '🍜', cls: 'food' };
  if (['景点','观光','寺庙','公园','sightseeing','attraction'].some(function(k){ return t.includes(k); })) return { emoji: '📷', cls: '' };
  if (['交通','地铁','电车','飞机','transport','train'].some(function(k){ return t.includes(k); })) return { emoji: '🚃', cls: 'transport' };
  if (['购物','商场','shopping','shop'].some(function(k){ return t.includes(k); })) return { emoji: '🛍️', cls: '' };
  if (['住宿','酒店','hotel'].some(function(k){ return t.includes(k); })) return { emoji: '🏨', cls: '' };
  return { emoji: '📍', cls: '' };
}

      photoHtml += '<div class="timeline-photo-actions">';
      photoHtml += '<button class="timeline-photo-btn" onclick="uploadPhoto(' + photoKey + ', \'' + storageKey + '\')" title="更换图片">📷</button>';
      photoHtml += '<button class="timeline-photo-btn" onclick="removePhoto(' + photoKey + ', \'' + storageKey + '\')" title="删除图片">🗑️</button>';
      photoHtml += '</div></div>';
    } else {
      photoHtml = '<label class="timeline-upload">';
      photoHtml += '📷 添加照片';
      photoHtml += '<input type="file" accept="image/*" onchange="handlePhotoUpload(event, ' + photoKey + ', \'' + storageKey + '\')">';
      photoHtml += '</label>';
    }
    // 地址栏 + 去这里按钮
    const addresses = getAddresses(storageKey);
    const addr = addresses[idx] || '';
    const gmapsUrl = addr ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(addr + ' Tokyo Japan') : '';
    let addressHtml = '<div class="timeline-address">';
    addressHtml += '<input type="text" class="timeline-address-input" placeholder="📍 输入地址（如：涩谷区神南1-23）" value="' + escapeHtml(addr) + '" onchange="saveAddress(' + idx + ', this.value, \'' + storageKey + '\')">';
    if (addr) {
      addressHtml += '<a href="' + gmapsUrl + '" target="_blank" rel="noopener" class="timeline-go-btn">🗺️ 去这里</a>';
    } else {
      addressHtml += '<span class="timeline-go-btn disabled">🗺️ 去这里</span>';
    }
    addressHtml += '</div>';

    // 备注栏（空状态用紧凑 chip，有内容才展开）
    const notes = getNotes(storageKey);
    const noteText = notes[idx] || '';
    const links = extractLinks(noteText);
    let noteHtml = '';
    if (!noteText.trim()) {
      // 空状态：小 chip，点击展开
      noteHtml = '<div class="timeline-note-empty" onclick="expandNote(' + idx + ', \'' + storageKey + '\', this)">📝 添加备注</div>';
    } else {
      noteHtml = '<div class="timeline-note">';
      noteHtml += '<div class="timeline-note-label">📝 备注</div>';
      noteHtml += '<textarea placeholder="备注..." ';
      noteHtml += 'oninput="saveNote(' + idx + ', this.value, \'' + storageKey + '\')" ';
      noteHtml += 'onblur="saveNoteAndToast(' + idx + ', this.value, \'' + storageKey + '\')">' + escapeHtml(noteText) + '</textarea>';
      if (links.length > 0) {
        noteHtml += '<div class="timeline-note-links">';
        links.forEach(function(link) {
          const shortLink = link.length > 35 ? link.substring(0, 32) + '...' : link;
          noteHtml += '<a href="' + link + '" target="_blank" rel="noopener" class="timeline-note-link">🔗 ' + shortLink + '</a>';
        });
        noteHtml += '</div>';
      }
      noteHtml += '</div>';
    }

    html += '<div class="timeline-item">';
    html += '<div class="timeline-time">' + timeHtml + '</div>';
    html += '<div class="timeline-dot">' + tInfo.emoji + '</div>';
    html += '<div class="timeline-content">';
    html += '<div class="timeline-title">' + timeEmoji(item.time) + ' ' + escapeHtml(item.title) + '</div>';
    html += descHtml;
    html += tagHtml;
    html += photoHtml;
    html += addressHtml;
    html += noteHtml;
    html += '</div></div>';
  });
  html += '</div>';
  container.innerHTML = html;
}

// 从备注文本中提取 URL（小红书、http链接等）
function extractLinks(text) {
  if (!text) return [];
  const links = [];
  // 匹配 http/https URL
  const urlRegex = /https?:\/\/[^\s，。、）)】]+/g;
  let m;
  while ((m = urlRegex.exec(text)) !== null) {
    links.push(m[0]);
  }
  // 匹配小红书 App 分享链接格式 xhslink.com/xxx
  const xhsRegex = /xhslink\.com\/[^\s，。、）)】]+/g;
  while ((m = xhsRegex.exec(text)) !== null) {
    const url = m[0];
    if (!links.includes(url) && !url.startsWith('http')) {
      links.push('https://' + url);
    }
  }
  return links;
}

function handlePhotoUpload(event, idx, storageKey) {
  const file = event.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    showToast('请选择图片文件', 'error');
    return;
  }
  if (file.size > 4 * 1024 * 1024) {
    showToast('图片过大（超过4MB），请压缩后再上传', 'error');
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    // 压缩图片到合理尺寸，避免localStorage超限
    compressImage(e.target.result, 1000, 0.8, function(compressed) {
      const photos = getPhotos(storageKey);
      photos[idx] = compressed;
      if (savePhotos(storageKey, photos)) {
        renderTimeline(storageKey);
        showToast('图片已上传！📸');
      }
    });
  };
  reader.readAsDataURL(file);
}

function uploadPhoto(idx, storageKey) {
  // 触发隐藏的文件选择
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = function(e) { handlePhotoUpload(e, idx, storageKey); };
  input.click();
}

function removePhoto(idx, storageKey) {
  if (!confirm('确定删除这张图片吗？')) return;
  const photos = getPhotos(storageKey);
  delete photos[idx];
  savePhotos(storageKey, photos);
  renderTimeline(storageKey);
  showToast('图片已删除');
}

// 压缩图片：等比缩放到maxWidth以内，输出JPEG dataURL
function compressImage(dataUrl, maxWidth, quality, callback) {
  const img = new Image();
  img.onload = function() {
    let w = img.width, h = img.height;
    if (w > maxWidth) { h = h * maxWidth / w; w = maxWidth; }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    // 白底，避免透明PNG变黑
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    callback(canvas.toDataURL('image/jpeg', quality));
  };
  img.onerror = function() { callback(dataUrl); };
  img.src = dataUrl;
}

// 天气预报（Open-Meteo 免费API）
// ============================================
function weatherCodeToInfo(code) {
  // WMO weather code 映射
  if (code === 0) return { icon: '☀️', desc: '晴' };
  if (code <= 2) return { icon: '🌤️', desc: '少云' };
  if (code === 3) return { icon: '☁️', desc: '阴' };
  if (code <= 48) return { icon: '🌫️', desc: '雾' };
  if (code <= 57) return { icon: '🌦️', desc: '小雨' };
  if (code <= 67) return { icon: '🌧️', desc: '雨' };
  if (code <= 77) return { icon: '🌨️', desc: '雪' };
  if (code <= 82) return { icon: ' showers ', desc: '阵雨' };
  if (code <= 86) return { icon: '🌨️', desc: '阵雪' };
  if (code >= 95) return { icon: '⛈️', desc: '雷阵雨' };
  return { icon: '🌡️', desc: '未知' };
}

function loadWeather(cityKey, dateStr) {
  const card = document.getElementById('weatherCard');
  if (!card) return;
  const city = CITIES[cityKey];
  if (!city || !city.lat) { card.style.display = 'none'; return; }

  const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + city.lat + '&longitude=' + city.lon
    + '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode'
    + '&timezone=Asia/Tokyo&start_date=' + dateStr + '&end_date=' + dateStr;

  fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      const daily = data.daily || {};
      const times = daily.time || [];
      const idx = times.indexOf(dateStr);
      if (idx < 0) {
        card.innerHTML = '<div class="weather-loading">📅 天气数据暂未可用（仅支持未来16天）</div>';
        return;
      }
      const tMax = daily.temperature_2m_max[idx];
      const tMin = daily.temperature_2m_min[idx];
      const rain = daily.precipitation_probability_max[idx];
      const code = daily.weathercode[idx];
      const wi = weatherCodeToInfo(code);
      card.innerHTML = '<div class="weather-icon">' + wi.icon + '</div>'
        + '<div class="weather-info">'
        + '<div class="weather-temp">' + Math.round(tMax) + '° / ' + Math.round(tMin) + '°C</div>'
        + '<div class="weather-desc">' + wi.desc + ' · ' + city.name + '</div>'
        + '<div class="weather-rain">💧 降水概率 ' + rain + '%</div>'
        + '</div>';
    })
    .catch(function(err) {
      card.innerHTML = '<div class="weather-loading">⚠️ 天气加载失败，请稍后重试</div>';
    });
}

// ============================================
// AI 智能行程推荐（本地算法版）
// ============================================
// Haversine 距离公式：计算两个经纬度之间的直线距离（公里）
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2)
    + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180)
    * Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// 在景点库中查找匹配（支持模糊匹配）
function findSpot(query) {
  const q = query.trim().toLowerCase();
  // 精确匹配
  for (const name in TOKYO_SPOTS) {
    if (name.toLowerCase() === q) return { name: name, info: TOKYO_SPOTS[name] };
  }
  // 包含匹配
  for (const name in TOKYO_SPOTS) {
    if (name.toLowerCase().includes(q) || q.includes(name.toLowerCase())) {
      return { name: name, info: TOKYO_SPOTS[name] };
    }
  }
  return null;
}

// 将时间字符串 "HH:MM" 转为分钟数
function timeToMinutes(t) {
  const parts = t.split(':');
  return parseInt(parts[0]) * 60 + parseInt(parts[1]);
}

// 分析某一天的行程空档
function analyzeDaySlots(storageKey) {
  const stored = localStorage.getItem(storageKey);
  let items = [];
  if (stored) { try { items = JSON.parse(stored); } catch(e) {} }
  items.sort(function(a, b) { return timeToMinutes(a.time) - timeToMinutes(b.time); });

  // 默认活动时段 09:00 - 22:00
  const dayStart = 9 * 60, dayEnd = 22 * 60;
  const slots = [];
  let cursor = dayStart;
  items.forEach(function(item) {
    const start = timeToMinutes(item.time);
    const end = item.endTime ? timeToMinutes(item.endTime) : start + 60; // 默认1小时
    if (start - cursor >= 60) {  // 至少1小时空档才算
      slots.push({ start: cursor, end: start });
    }
    cursor = Math.max(cursor, end);
  });
  if (dayEnd - cursor >= 60) slots.push({ start: cursor, end: dayEnd });

  // 计算每个空档的中心点坐标（用该天最后一个有地址的景点作为参考）
  const addresses = getAddresses(storageKey);
  let lastCoord = null;
  // 也从已有行程的标题里找坐标
  for (let i = items.length - 1; i >= 0; i--) {
    const addr = addresses[i];
    if (addr) {
      const spot = findSpot(addr) || findSpot(items[i].title);
      if (spot) { lastCoord = { lat: spot.info.lat, lon: spot.info.lon }; break; }
    }
    const spot = findSpot(items[i].title);
    if (spot) { lastCoord = { lat: spot.info.lat, lon: spot.info.lon }; break; }
  }

  return { items: items, slots: slots, lastCoord: lastCoord };
}

// AI 推荐：遍历所有日期，找最佳空档
function aiRecommend(cityKey) {
  const input = document.getElementById('aiInput');
  const resultDiv = document.getElementById('aiResult');
  const query = input.value.trim();
  if (!query) { showToast('请输入景点名', 'error'); return; }

  const spot = findSpot(query);
  if (!spot) {
    resultDiv.innerHTML = '<div class="ai-result"><div class="ai-result-title">😕 未找到该地点</div>'
      + '<div class="ai-result-detail">景点库中暂无「' + escapeHtml(query) + '」的坐标数据。<br>你可以直接到对应日期手动添加，或尝试输入：浅草寺、涩谷sky、银座、东京塔等热门景点。</div></div>';
    return;
  }

  const city = CITIES[cityKey];
  const candidates = [];

  city.dates.forEach(function(dateStr) {
    const storageKey = cityKey + '-' + dateStr;
    const analysis = analyzeDaySlots(storageKey);
    const info = city.dateLabels[dateStr];

    analysis.slots.forEach(function(slot) {
      // 推荐时间：空档开始后30分钟（留缓冲）
      const recMin = slot.start + 30;
      const recTime = String(Math.floor(recMin / 60)).padStart(2, '0') + ':' + String(recMin % 60).padStart(2, '0');
      const slotLen = slot.end - slot.start;

      // 距离评分：与该天最后一个景点的距离
      let distScore = 0;
      let distText = '当天首个景点';
      if (analysis.lastCoord) {
        const dist = haversine(analysis.lastCoord.lat, analysis.lastCoord.lon, spot.info.lat, spot.info.lon);
        distText = '距上一景点 ' + dist.toFixed(1) + ' 公里';
        // 距离越近分数越高（5公里内满分，每增加5公里扣1分）
        distScore = Math.max(0, 5 - dist / 5);
      }

      // 空档长度评分：空档越长越适合（2小时以上满分）
      const slotScore = Math.min(5, slotLen / 120 * 5);

      // 总分
      const totalScore = distScore * 0.6 + slotScore * 0.4;

      candidates.push({
        dateStr: dateStr,
        dayLabel: info.day,
        weekday: info.weekday,
        title: info.title,
        time: recTime,
        slotLen: slotLen,
        distText: distText,
        distScore: distScore,
        slotScore: slotScore,
        totalScore: totalScore,
        itemCount: analysis.items.length
      });
    });
  });

  if (candidates.length === 0) {
    resultDiv.innerHTML = '<div class="ai-result"><div class="ai-result-title">📅 行程已满</div>'
      + '<div class="ai-result-detail">所有日期的 09:00-22:00 时段都排满了。建议先调整现有行程留出空档，或手动添加到某一天。</div></div>';
    return;
  }

  // 按总分排序
  candidates.sort(function(a, b) { return b.totalScore - a.totalScore; });
  const best = candidates[0];

  // 显示推荐结果
  const slotHours = (best.slotLen / 60).toFixed(1);
  let detailHtml = '<div class="ai-result-detail">';
  detailHtml += '📍 <strong>' + escapeHtml(spot.name) + '</strong>（' + spot.info.type + '）<br>';
  detailHtml += '🗓️ 推荐日期：<strong>' + formatDate(best.dateStr) + ' ' + best.dayLabel + ' ' + best.weekday + '</strong><br>';
  detailHtml += '⏰ 推荐时间：<strong>' + best.time + '</strong>（该时段空档 ' + slotHours + ' 小时）<br>';
  detailHtml += '🚶 ' + best.distText + '<br>';
  detailHtml += '📊 当天已有 ' + best.itemCount + ' 个行程项<br>';
  // 推荐理由
  let reasons = [];
  if (best.distScore >= 4) reasons.push('地理位置接近你当天其他行程');
  if (best.slotScore >= 4) reasons.push('该时段有充足的空档时间');
  if (best.itemCount === 0) reasons.push('当天暂无行程，适合作为起点');
  if (reasons.length === 0) reasons.push('综合时间和距离的最佳选择');
  detailHtml += '💡 <strong>推荐理由：</strong>' + reasons.join('；');
  detailHtml += '</div>';

  resultDiv.innerHTML = '<div class="ai-result">'
    + '<div class="ai-result-title">✨ AI 推荐结果</div>'
    + detailHtml
    + '<div class="ai-result-actions">'
    + '<button class="btn" onclick="acceptAiRecommend(\'' + cityKey + '\', \'' + best.dateStr + '\', \'' + best.time + '\', \'' + spot.name.replace(/'/g, "\\'") + '\', \'' + spot.info.type + '\')">✅ 接受并添加到行程</button>'
    + '<button class="btn btn-secondary" onclick="document.getElementById(\'aiResult\').innerHTML=\'\'">❌ 取消</button>'
    + '</div></div>';
}

// 接受 AI 推荐，自动添加到对应日期
function acceptAiRecommend(cityKey, dateStr, time, spotName, spotType) {
  const storageKey = cityKey + '-' + dateStr;
  const stored = localStorage.getItem(storageKey);
  let items = [];
  if (stored) { try { items = JSON.parse(stored); } catch(e) {} }
  items.push({
    time: time,
    endTime: null,
    title: spotName,
    desc: 'AI 推荐添加',
    tag: spotType
  });
  items.sort(function(a, b) { return timeToMinutes(a.time) - timeToMinutes(b.time); });
  localStorage.setItem(storageKey, JSON.stringify(items));
  showToast('✅ 已添加到 ' + formatDate(dateStr) + ' 的 ' + time + ' 时段');
  document.getElementById('aiResult').innerHTML = '<div class="ai-result"><div class="ai-result-title">✅ 添加成功！</div><div class="ai-result-detail">已添加到 <strong>' + formatDate(dateStr) + ' ' + time + '</strong>。<br>点击下面对应日期查看完整行程。</div>'
    + '<button class="btn" onclick="navigate(\'' + cityKey + '/' + dateStr + '\')">查看当天行程 →</button></div>';
}

function clearItinerary(storageKey) {
  if (!confirm('确定要清空当天的行程吗？')) return;
  localStorage.removeItem(storageKey);
  localStorage.removeItem(storageKey + '-photos');
  localStorage.removeItem(storageKey + '-addresses');
  localStorage.removeItem(storageKey + '-notes');
  renderTimeline(storageKey);
  showToast('行程已清空');
}

// ============================================
// 主渲染入口
// ============================================
function render() {
  const route = getRoute();
  renderBreadcrumb(route);
  if (route.view === 'home') renderHome();
  else if (route.view === 'city') renderCity(route.city);
  else if (route.view === 'day') renderDay(route.city, route.date);
  window.scrollTo(0, 0);
}

// 初始化
render();
